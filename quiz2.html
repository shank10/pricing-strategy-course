<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Game Check | Strategy in the Wild</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="pt-8 pb-6 px-6 border-b border-slate-800 bg-slate-950/50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="index.html" class="inline-block" title="Return to Course Homepage">
                <img src="assets/poorit-mark.png" alt="Return Home" class="h-10 hover:opacity-80 transition-opacity">
            </a>
            <div class="text-right">
                <span class="bg-amber-900 text-amber-300 text-xs font-bold px-3 py-1 rounded uppercase tracking-wider">Post-Game Knowledge Check</span>
            </div>
        </div>
    </header>

    <!-- Quiz Container -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-4xl w-full">
            
            <!-- Progress Bar -->
            <div class="mb-8 flex justify-between items-center text-sm font-bold text-slate-500 uppercase tracking-widest">
                <span id="quiz-progress">Scenario 1 of 4</span>
            </div>

            <!-- Card -->
            <div class="bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                
                <!-- Setup Section -->
                <div class="p-10 border-b border-slate-700">
                    <h2 id="scenario-title" class="text-3xl font-extrabold text-white mb-6">Scenario Title</h2>
                    <div class="bg-slate-900/50 p-6 rounded-xl border border-slate-600 mb-6">
                        <h3 class="text-sm font-bold text-amber-500 uppercase tracking-widest mb-2">The Setup</h3>
                        <p id="scenario-setup" class="text-xl text-slate-300 leading-relaxed">
                            Scenario setup text goes here.
                        </p>
                    </div>
                    
                    <div class="flex items-start space-x-4">
                        <div class="text-4xl">🎤</div>
                        <div>
                            <h3 class="text-sm font-bold text-blue-400 uppercase tracking-widest mb-1">Cold-Call Prompt</h3>
                            <p id="scenario-prompt" class="text-2xl font-semibold text-white italic">
                                "Prompt goes here"
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Answer Section (Hidden by Default) -->
                <div id="answer-section" class="hidden bg-slate-800 p-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-900/40 via-slate-800 to-slate-800">
                    <h3 class="text-sm font-bold text-emerald-400 uppercase tracking-widest mb-2">The Strategy</h3>
                    <h4 id="answer-title" class="text-3xl font-bold text-emerald-300 mb-4">Strategy Title</h4>
                    <p id="answer-desc" class="text-lg text-slate-300 leading-relaxed">
                        Answer description goes here.
                    </p>
                </div>

                <!-- Controls -->
                <div class="p-6 bg-slate-900 flex justify-between items-center border-t border-slate-700">
                    <button onclick="revealAnswer()" id="btn-reveal" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-8 rounded-xl transition shadow-[0_0_20px_rgba(245,158,11,0.3)]">
                        Reveal Strategy ➔
                    </button>
                    <button onclick="nextScenario()" id="btn-next" class="hidden bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl transition shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                        Next Scenario ➔
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script>
        const scenarios = [
            {
                title: "The Parle-G Paradox",
                setup: "Despite severe inflation in the cost of wheat, sugar, and transport over the last 25 years, Parle-G has famously managed to keep its entry-level biscuit pack priced at exactly ₹5.",
                prompt: "How does a company survive decades of inflation without ever touching their primary price tag? What is the strategy?",
                answerTitle: "Price Pack Architecture / Shrinkflation",
                answerDesc: "Parle-G aggressively utilizes shrinkflation. Consumers are deeply anchored to the ₹5 coin (price elasticity). Instead of raising the price to ₹6 or ₹7, which would devastate sales, Parle systematically reduced the weight of the pack from 100g down to 50g over the years. They protect the psychological price point by sacrificing volume."
            },
            {
                title: "The EV Battery Play",
                setup: "Indian EV startup Bounce Infinity launched their scooter at a highly disruptive price of just ₹45,000 (below cost). However, the scooter is sold *without* a battery. Buyers must subscribe to a Battery-as-a-Service plan for ₹1,250 a month.",
                prompt: "Why would Bounce take a massive loss on the physical scooter? What are they really selling?",
                answerTitle: "Servitization / Total Cost of Ownership",
                answerDesc: "They are shifting from hardware margins to a recurring annuity. By removing the battery, they lower the upfront Total Cost of Ownership (TCO) to beat petrol scooters on launch price. The ₹1,250 monthly subscription guarantees years of locked-in, high-margin recurring revenue, turning a one-time hardware buyer into a lifetime subscriber."
            },
            {
                title: "The Zepto Rain Surge",
                setup: "During intense Mumbai monsoons, quick-commerce apps automatically apply a ₹35 'Rain Fee' to every order. However, the platforms explicitly state that 100% of this fee goes directly to the delivery partner.",
                prompt: "If the company isn't keeping a single rupee of the surge fee, why risk annoying the customer by charging it at all?",
                answerTitle: "Liquidity over Margin",
                answerDesc: "In a two-sided marketplace, the product is *network reliability*. During a storm, demand spikes but supply crashes (riders log off). The ₹35 fee isn't meant to make Zepto rich; it is a mechanical tool to 'buy supply' by incentivizing riders to stay on flooded roads. Without the fee, orders wouldn't get delivered at all, destroying the platform's SLA."
            },
            {
                title: "Freshworks' Security Gate",
                setup: "Indian SaaS giant Freshworks offers fantastic 'Free' and 'Growth' tiers for small startups. However, if a company wants 'Single Sign-On' (SSO)—a feature that costs Freshworks almost nothing to run—they must upgrade to the 'Enterprise' tier, which costs 400% more.",
                prompt: "If SSO is incredibly cheap for Freshworks to host, why do they hide it behind their most expensive paywall?",
                answerTitle: "Feature Fencing",
                answerDesc: "SSO and Audit Logs are strict compliance requirements for large, Fortune 500 corporations. Freshworks uses these features as 'fences' to prevent massive, wealthy corporations from cannibalizing their revenue by buying the cheap startup tiers. They are pricing based on the enterprise's Willingness to Pay, not the cost of the feature."
            }
        ];

        let currentIndex = 0;

        const elProgress = document.getElementById('quiz-progress');
        const elTitle = document.getElementById('scenario-title');
        const elSetup = document.getElementById('scenario-setup');
        const elPrompt = document.getElementById('scenario-prompt');
        const elAnsSection = document.getElementById('answer-section');
        const elAnsTitle = document.getElementById('answer-title');
        const elAnsDesc = document.getElementById('answer-desc');
        const btnReveal = document.getElementById('btn-reveal');
        const btnNext = document.getElementById('btn-next');

        function loadScenario(index) {
            const data = scenarios[index];
            elProgress.innerText = `Scenario ${index + 1} of ${scenarios.length}`;
            elTitle.innerText = data.title;
            elSetup.innerText = data.setup;
            elPrompt.innerText = `"${data.prompt}"`;
            
            elAnsTitle.innerText = data.answerTitle;
            elAnsDesc.innerText = data.answerDesc;

            elAnsSection.classList.add('hidden');
            elAnsSection.classList.remove('fade-in');
            btnReveal.classList.remove('hidden');
            btnNext.classList.add('hidden');
        }

        function revealAnswer() {
            elAnsSection.classList.remove('hidden');
            elAnsSection.classList.add('fade-in');
            btnReveal.classList.add('hidden');
            btnNext.classList.remove('hidden');

            if (currentIndex === scenarios.length - 1) {
                btnNext.innerText = "Finish & Return to Main Page ➔";
            }
        }

        function nextScenario() {
            if (currentIndex < scenarios.length - 1) {
                currentIndex++;
                loadScenario(currentIndex);
            } else {
                window.location.href = "index.html";
            }
        }

        window.onload = () => loadScenario(0);
    </script>
</body>
</html>
